services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    shm_size: 128mb # Recommended to avoid shared memory crashes
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgtres@123
      POSTGRES_DB: bill-service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bill-service"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: gauravtayde1699@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Gaurav@123
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
